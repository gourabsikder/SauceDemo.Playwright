name: Playwright Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          $playwrightScript = Get-ChildItem -Path . -Recurse -Filter playwright.ps1 | Select-Object -First 1
          & $playwrightScript.FullName install

      - name: Run tests and generate reports
        run: dotnet test --no-build --configuration Release -- --report-html --report-html-filename test-report.html --report-trx --report-trx-filename test-results.trx

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**
          if-no-files-found: ignore
